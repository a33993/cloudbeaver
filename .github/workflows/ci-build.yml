name: CI Build - CloudBeaver

on:
  workflow_dispatch:
  push:
    branches: [ "devel", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: "-DskipTests"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable corepack (yarn v4)
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
      - name: Clone required upstream repos
        run: |
          # Clone upstream repos into the parent workspace directory so aggregate POM finds them
          git clone https://github.com/dbeaver/dbeaver.git ../dbeaver
          git clone https://github.com/dbeaver/dbeaver-common.git ../dbeaver-common
          git clone https://github.com/dbeaver/dbeaver-jdbc-libsql.git ../dbeaver-jdbc-libsql || true

      - name: Build and install upstream parent POMs (debug)
        run: |
          set -e
          mkdir -p build/logs
          if [ -d "../dbeaver" ]; then
            (cd ../dbeaver && mvn -T1C -DskipTests -e -X clean install | tee ../cloudbeaver/build/logs/dbeaver-mvn.log)
          fi
          if [ -d "../dbeaver-common" ]; then
            (cd ../dbeaver-common && mvn -T1C -DskipTests -e -X clean install | tee ../cloudbeaver/build/logs/dbeaver-common-mvn.log)
          fi

      - name: Build server (Maven) (debug)
        working-directory: server/product/aggregate
        run: |
          mkdir -p ../../build/logs || true
          mvn -e -X clean verify -Dheadless-platform -DskipTests | tee ../../build/logs/aggregate-mvn.log

      - name: Build frontend
        working-directory: webapp
        run: |
          yarn
          cd packages/product-default
          yarn run bundle

      - name: Prepare cloudbeaver package
        run: |
          set -e
          mkdir -p build/cloudbeaver
          # copy server product output (adjust paths if product output path differs)
          cp -r server/product/web-server/target/products/io.cloudbeaver.product/all/all/all/* build/cloudbeaver/ || true
          cp -r deploy/scripts/* build/cloudbeaver/ || true
          mkdir -p build/cloudbeaver/web
          cp -r webapp/packages/product-default/lib/* build/cloudbeaver/web/ || true
          mkdir -p build/cloudbeaver/conf
          cp -r config/core/* build/cloudbeaver/conf/ || true

      - name: Zip artifact
        run: |
          cd build
          zip -r cloudbeaver-windows-ready.zip cloudbeaver

      - name: Upload Maven logs
        uses: actions/upload-artifact@v4
        with:
          name: maven-logs
          path: build/logs/**/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudbeaver-windows-ready
          path: build/cloudbeaver-windows-ready.zip
